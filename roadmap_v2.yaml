- id: phase-282
  title: GeOS VM -- Typed Memory Access Opcodes (LOADW, LOADH, LOADB, STOREW, STOREH,
    STOREB)
  status: done
  goal: Add byte (8-bit) and halfword (16-bit) memory access opcodes for efficient
    data packing and network protocol handling.
  description: The VM currently only supports 32-bit word LOAD/STORE. Accessing individual
    bytes requires read-modify-write with masking and shifting (4+ instructions per
    byte). Network protocols, PNG parsing, and packed data structures all need byte-level
    access. LOADB/STOREB read/write a single byte from a word, LOADH/STOREH handle
    16-bit halfwords.
  deliverables:
  - name: 'LOADB opcode (0xFB): load byte at address, zero-extend to u32'
    status: done
  - name: 'STOREB opcode (0xFC): store low byte of register, preserve upper 24 bits'
    status: done
  - name: 'LOADH opcode (0xFD): load halfword (16-bit), zero-extend to u32'
    status: done
  - name: 'STOREH opcode (0xFE): store low halfword, preserve upper 16 bits'
    status: done
  - name: Assembler and disassembler support
    status: done
  - name: Unit tests for alignment, boundary, and masking behavior
    status: done
  - name: 'Integration test: byte_demo.asm demonstrating packed data access'
    status: done
  acceptance_criteria:
  - description: Byte/halfword ops work correctly on all alignments
    validation: cargo test --lib loadb storeb loadh storeh
  - description: Assembler produces correct bytecode for all four opcodes
    validation: cargo test --lib test_byte_ops_assemble
