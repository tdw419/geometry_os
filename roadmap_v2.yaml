- id: phase-201
  title: RISC-V Guest Networking -- Socket Syscall Layer
  status: done
  goal: Enable bare-metal RISC-V C programs to open TCP connections and exchange data
  description: 'The GeOS VM has TCP opcodes (CONNECT, SOCKSEND, SOCKRECV) but the
    RISC-V guest has no networking path. The syscall layer (src/riscv/syscall.rs)
    already lists socket/syscall numbers but returns -ENOSYS. Wire these to real host
    sockets via a simple proxy: guest writes a socket request to a shared MMIO buffer,
    host picks it up and performs the real connect/send/recv. This gives paint.c and
    sh.c the ability to fetch data from the network.'
  deliverables:
  - name: Socket syscall implementation for RISC-V guest
