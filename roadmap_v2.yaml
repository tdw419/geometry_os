- id: phase-255
  title: GeOS VM -- Conditional Move and Select Opcodes (CMOV, CSEL)
  status: done
  goal: Add branchless conditional move opcodes for performance-critical inner loops
  description: Conditional moves eliminate branch misprediction stalls in hot loops
    (pixel rendering, collision detection). CMOV rd, rs moves rs to rd if r0 != 0
    (after CMP). CSEL rd, rs1, rs2 selects rs1 if r0 != 0 else rs2. These are common
    in GPU architectures and enable branchless min/max, clamping, and multiplexing
    patterns.
  deliverables:
  - name: Conditional move opcodes
    status: done
    tasks:
    - id: p255.d1.t1
      title: Implement CMOV rd, rs (0xE0) and CSEL rd, rs_true, rs_false (0xEF)
      description: 'CMOV: if r0 != 0 then rd = rs. CSEL: if r0 != 0 then rd = rs_true
        else rd = rs_false. Both read CMP result from r0.'
      scope_files:
      - src/vm/mod.rs
      - src/assembler/ops_extended.rs
      scope_lines: 60
    - id: p255.d1.t2
      title: Add disassembler and assembler entries
      description: Wire both opcodes. CMOV is 3-word, CSEL is 4-word.
      scope_files:
      - src/vm/disasm.rs
      - src/assembler/ops_extended.rs
      scope_lines: 30
    - id: p255.d1.t3
      title: Add tests and branchless patterns
      description: Test CMOV with r0=0 and r0=1. Test CSEL select true/false. Write
        test showing branchless min/max using CSEL.
      scope_files:
      - src/vm/tests.rs
      scope_lines: 60
  test_target: 8
  scope_lines_total: 150
