- id: phase-285
  title: GeOS VM -- Error Code Propagation in Syscalls
  status: done
  goal: Replace silent failures in VFS/syscall opcodes with meaningful error codes
    returned in r0.
  description: Currently, OPEN/READ/WRITE/CLOSE failures silently return 0 or garbage.
    Programs cannot distinguish between 'file not found', 'permission denied', and
    'disk full'. Adding error codes to r0 on failure (positive values = fd/success,
    negative = error code) enables robust error handling in shell.asm, the nano editor,
    and file_browser.
  deliverables:
  - name: Define error code constants (ENOSPC=1, ENOENT=2, EPERM=3, EIO=4, EISDIR=5)
    status: done
  - name: OPEN returns -ENOENT when file not found, -EPERM when capability denied
    status: done
  - name: READ returns -EIO on read past EOF or device error
    status: done
  - name: WRITE returns -ENOSPC when VFS storage full
    status: done
  - name: IOCTL returns -EINVAL for invalid commands
    status: done
  - name: Unit tests for each error path
    status: done
  - name: Update shell.asm to check error codes and display messages
    status: done
  acceptance_criteria:
  - description: All syscall failures return negative error codes in r0
    validation: cargo test --lib syscall_error_codes
  - description: Shell displays error messages for failed operations
    validation: Integration test verifies error message in terminal output
  _completed_at: 1778311800
