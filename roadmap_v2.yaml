- id: phase-289
  title: GeOS VM -- Mutex and Semaphore IPC Primitives
  status: done
  goal: Add mutex and semaphore opcodes for safe inter-process resource sharing.
  description: The VM has PIPE and MSGSND/MSGRCV for data IPC, but no synchronization
    primitives. Multiple processes accessing shared resources (files, memory regions,
    devices) can race. Adding MTEXINIT, MTEXLOCK, MTEXUNLOCK, SEMINIT, SEMWAIT, SEMPOST
    provides the building blocks for safe concurrent access patterns.
  deliverables:
  - name: 'MTEXINIT opcode: initialize a mutex at a RAM address'
    status: done
  - name: 'MTEXLOCK opcode: acquire lock (block if held by another process)'
    status: done
  - name: 'MTEXUNLOCK opcode: release lock (wake one waiter)'
    status: done
  - name: 'SEMINIT opcode: initialize semaphore with count'
    status: done
  - name: 'SEMWAIT opcode: decrement semaphore (block if zero)'
    status: done
  - name: 'SEMPOST opcode: increment semaphore (wake one waiter)'
    status: done
  - name: Unit tests for lock acquisition, blocking, and wake-up
    status: done
  - name: 'Integration test: two processes sharing a counter via mutex'
    status: done
  acceptance_criteria:
  - description: Mutex prevents concurrent access to shared resource
    validation: Race condition test passes 1000 iterations
  - description: Semaphore correctly blocks and wakes processes
    validation: Producer-consumer test with 4 processes completes
