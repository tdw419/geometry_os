global_risks:
- 'Interpreter performance ceiling: 52 MIPS may not scale to complex guest programs'
- 'Premature abstraction: libgeos.c should only be extracted when truly needed'
- Cross-system pixel reads (U3) need locking or same-thread execution when a use case
  appears
conventions:
- Build all RISC-V examples with -march=rv32imac_zicsr -mabi=ilp32
- Use build.sh-style flags (ffreestanding, nostdlib, O2, medany)
- 'Power-of-two constants: use bit masks (x & 0xFF) not modulo (x % 256)'
- Present callback must be channel-based, never synchronous in bus write
- SPEC = thesis. roadmap_v2 = arc. OpenSpec = per-change diff. Three docs, three jobs.
meta:
  interpreter_mips: 52
  framebuffer_size: 256x256
  framebuffer_addr: '0x6000_0000'
  pixel_format_riscv: 0xRRGGBBAA (SBI contract, alpha in low byte)
  pixel_format_display: 0x00RRGGBB (minifb, vm.screen canonical surface)
  canonical_surface: vm.screen (256x256 Vec<u32>)
  sbi_extension_id: '0x47454F00'
  dtb_isa: rv32imac
  phases_total: 141
  phases_done: 129
  phases_remaining: 12
  opcodes: 214
  programs: 219
  loc: 132466
  tests: 3959
