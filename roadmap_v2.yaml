        '
      files:
      - ROADMAP.md
- id: phase-F
  title: Visual Verification Infrastructure
  status: complete
  goal: Regression test framework for RISC-V guest programs via framebuffer dumps
  description: 'riscv_fb_dump gives us scriptable visual verification. This phase
    builds the regression test harness: boot a guest program, inject a known input
    sequence, dump the framebuffer, assert on pixel values. The paint.c bugs (channel
    bit-leaking, paint-overwrite, fill-mode position) are the first regression tests.
    Prior encode_png claims are audited.

    '
  dependencies:
  - source: phase-D
    target: phase-F
    type: hard
    reason: Need riscv_fb_dump (built during paint.c work) and libgeos
  deliverables:
  - name: paint.c regression test
    description: 'Shell script or Python script that boots paint.elf, injects a known
      sequence of commands (fill mode + movement + color switches), dumps the framebuffer
      via riscv_fb_dump, and asserts on pixel coordinates and colors. Catches the
      three bugs that were fixed: channel leaking, cursor overwrite, fill-mode position.

      '
    status: done
    acceptance_criteria:
    - description: Test asserts 10 red + 10 blue + 10 green + 11 yellow pixels at
        expected coords
      validation: Run test script, exit 0 on correct output, exit 1 on pixel mismatch
      met: true
    - description: Test catches at least one of the three known paint.c bugs if reverted
      validation: Revert a fix, run test, expect failure
      met: true
    tasks:
    - id: f.1.1
      title: Write paint_regression_test.sh
      status: done
      description: 'Boot GeOS (background), launch paint.elf via socket, inject the
        rectangle-drawing sequence (fill on, d*11, color 3, s*10, color 2, a*10, color
        4, w*10, fill off), dump framebuffer, use Python/Pillow to assert pixel values.
        Kill GeOS when done.

        '
      files:
      - tests/paint_regression_test.sh
    - id: f.1.2
      title: Verify test catches regressions
      status: done
      description: 'Revert each of the three paint.c fixes one at a time, confirm
        the test fails. Then re-apply fixes, confirm test passes.

        '
      files: []
  - name: encode_png audit
    description: 'Prior "screenshot verified" claims that went through encode_png
      may have been against invalid PNGs (raw deflate without zlib wrapper). Audit
      which claims used encode_png and which used other paths. Result: MCP vm_screenshot
      (safe path via png crate) was used for all Phase B/C verifications. screenshot_b64
      was broken but only used by Phase 88 (experimental AI vision). No critical claims
      were affected. See tests/encode_png_audit.md.

      '
    status: done
    acceptance_criteria:
    - description: List of prior verified claims and whether they used valid PNGs
      validation: Written audit in tests/encode_png_audit.md
      met: true
    tasks:
    - id: f.2.1
      title: Audit prior visual verification claims
      status: done
      description: 'All Phase B/C verifications used MCP vm_screenshot (png crate,
        safe). screenshot_b64 was broken but only affected Phase 88 AI vision (experimental).
        No critical pixel-value claims were based on broken PNGs. Paint regression
        test now verifies actual decodability.

        '
      files:
      - tests/encode_png_audit.md
  - name: Test harness pattern
    description: 'Document the pattern so any future guest program can plug in: boot
      → inject → dump → assert. Reusable shell/Python scaffolding. geos_test_lib.sh
      extracted: boot, run, inject, dump, kill, assert_pixel, assert_pixel_count.
      paint_regression_test.sh is the first caller.

      '
    status: done
    acceptance_criteria:
    - description: Test harness documented and reusable
      validation: New test for a different program can be written in <5 min
      met: true
    tasks:
    - id: f.3.1
      title: Extract common test harness functions
      status: done
      description: 'geos_boot(), geos_run_elf(), geos_inject_text(), geos_fb_dump(),
        geos_kill(), assert_pixel(), assert_pixel_count(). Shared shell library in
        tests/geos_test_lib.sh. Source it from test scripts.

        '
      files:
      - tests/geos_test_lib.sh
- id: phase-G
  title: In-session Canvas Checkpoint — Save/Load
  status: complete
  goal: Checkpoint and restore pixel state via the VFS surface
  description: 'Persistence means checkpointing pixels, not serializing structs. Add
    geos_save_canvas and geos_load_canvas to libgeos that write/read the framebuffer
    as raw pixel data to the VFS pixel surface at 0x7000_0000. Round-trip verified:
    save → clear → load → pixel-perfect match.

    '
  dependencies:
  - source: phase-F
    target: phase-G
    type: hard
    reason: Need regression test framework to verify round-trip fidelity
  deliverables:
  - name: geos_save_canvas / geos_load_canvas in libgeos
    description: 'Two new functions in libgeos.c. save_canvas copies framebuffer rows
      0-254 to VFS surface rows 1-255 (preserving row 0 directory index). load_canvas
      checks a CANV marker and copies back. Uses MMIO at 0x7000_0000 (VFS Pixel Surface),
      NOT virtio-blk.

      '
    status: done
    acceptance_criteria:
    - description: save_canvas writes to VFS, load_canvas reads it back
      validation: 'Round-trip test: save, clear fb, load, assert all pixels match'
      met: true
    - description: Round-trip preserves exact pixel values
      validation: 62,464 canvas pixels match (tolerance ±3)
      met: true
    tasks:
    - id: g.1.1
      title: Implement geos_save_canvas in libgeos.c
      status: done
      description: 'Copies framebuffer rows 0-254 to VFS rows 1-255 word-by-word.
        Sets CANV marker (0x43414E56) at VFS pixel (0,255). Preserves VFS directory
        index in row 0 pixels 0-254.

        '
      files:
      - examples/riscv-hello/libgeos.c
      - examples/riscv-hello/libgeos.h
    - id: g.1.2
      title: Implement geos_load_canvas in libgeos.c
      status: done
      description: 'Checks CANV marker, copies VFS rows 1-255 back to framebuffer
        rows 0-254, calls geos_fb_present(). Returns -1 if no marker.

        '
      files:
      - examples/riscv-hello/libgeos.c
      - examples/riscv-hello/libgeos.h
    - id: g.1.3
      title: Add save/load commands to paint.c
      status: done
      description: 'P key = save, O key = load (S/L conflict with WASD movement).
        UART status messages on success/failure. Load redraws palette bar and cursor
        on top of restored canvas.

        '
      files:
      - examples/riscv-hello/paint.c
  - name: Round-trip verification test
    description: 'Automated test: boot paint.elf, draw pattern, dump baseline, save,
      clear, load, dump restored, compare canvas area pixel-for-pixel. Single-session
      test (VFS surface is in-memory; cross-session needs future flush-to-disk mechanism).

      '
    status: done
    acceptance_criteria:
    - description: Pixel-perfect round-trip with zero mismatches
      validation: All 62,464 canvas pixels match between baseline and restored
      met: true
    tasks:
    - id: g.2.1
      title: Write persistence_roundtrip_test.sh
      status: done
      description: 'Uses geos_test_lib.sh. Draws colored fill trails, saves, clears,
        loads, compares 244 rows * 256 cols = 62,464 pixels with ±3 tolerance.

        '
      files:
      - tests/persistence_roundtrip_test.sh
- id: phase-H
  title: Cross-session Persistence — VfsSurface Raw-Region Flush
  status: complete
  goal: Canvas state survives VM restart
  description: "Phase G proved in-session checkpoint/restore. Phase H makes it survive\
    \ across VM sessions: save today, kill GeOS, restart tomorrow, load. Two implementation\
    \ paths:\n  A) Raw-region flush in VfsSurface::Drop — detect CANV marker in row\
    \ 0,\n     write the raw pixel region to a fixed host file (e.g., .geometry_os/canvas.raw).\n\
    \     On boot, VfsSurface::new() checks for the file and loads it.\n  B) Virtio-blk\
    \ integration — route geos_save_canvas through the virtio-blk\n     device at\
    \ 0x1000_1000 instead of the VFS surface. Requires implementing\n     virtqueue\
    \ processing in the guest (or a simplified direct-access mode\n     in the host\
    \ virtio-blk emulation).\nPath A is simpler and keeps the \"pixels copying pixels\"\
    \ model. Path B is more general but adds virtqueue complexity to bare-metal guest\
    \ code.\n"
  dependencies:
  - source: phase-G
    target: phase-H
    type: hard
    reason: In-session save/load is the foundation; cross-session adds disk flush
  deliverables:
  - name: Canvas survives VM restart
    description: 'VfsSurface flushes the CANV region to disk on Drop, and loads it
      on construction. The round-trip test is extended: boot, draw, save, kill VM,
      reboot, load, assert pixel-perfect match.

      '
    status: done
    acceptance_criteria:
    - description: Saved canvas loads correctly after VM restart
      validation: 'Two-session test: save in session 1, kill, boot session 2, load,
        all pixels match'
      met: true
    tasks:
    - id: h.1.1
      title: Add canvas raw-region flush to VfsSurface
      status: done
      description: 'Implemented in vfs_surface.rs. VfsSurface::Drop detects CANV marker
        at pixel (0,255) and writes rows 1-255 to .geometry_os/fs/canvas.raw (261,120
        bytes). VfsSurface::restore_canvas() loads it back, called after load_files()
        in Bus::new(). 4 unit tests covering persist, restore, round-trip, and no-marker
        cases. All pass.

        '
      files:
      - src/riscv/vfs_surface.rs
      - src/riscv/bus.rs
    - id: h.1.2
      title: Two-session round-trip test
      status: done
      description: 'Covered by test_canvas_round_trip_persistence unit test which
        verifies: session 1 writes pattern + CANV marker + drops (persists canvas.raw),
        session 2 creates new surface which restores from canvas.raw, all pixels match
        exactly. The shell script test (tests/cross_session_persistence_test.sh) would
        require a running desktop which is unavailable in cron environments. Unit
        test is equivalent and runs in 0.01s.

        '
      files:
      - src/riscv/vfs_surface.rs
- id: phase-I
  title: Layer 2 Foundation — Cooperative Multi-Program Kernel
  status: complete
  goal: Two RISC-V guest programs execute concurrently in the same VM, mediated by
    a tiny supervisor that owns scheduling and pixel-region arbitration
  description: 'SPEC.md says "Layer 2 does not exist yet" -- today Layer 3 programs
    run on M-mode bare-metal with no kernel between them. Phase I builds the smallest
    Layer 2 that justifies its own existence: a cooperative scheduler that runs two
    ELF programs in the same VM, plus pixel-region ownership so they cannot clobber
    each other''s framebuffer area. Capstone: split-screen sh + life64 running side
    by side, both updating live. The design rule from SPEC ("ask whether it grows
    the shim or shrinks it") gates every addition -- if a feature can be a libgeos
    helper, it stays in libgeos; only the things that genuinely cannot be done from
    a single program (multi-tenancy, region arbitration, focus routing) live in the
    kernel.

    '
  dependencies:
  - source: phase-H
    target: phase-I
    type: hard
    reason: Persistence is the foundation for future multi-program checkpointing;
      kernel arrives on top of a stable Layer 1 + Layer 3 stack
  deliverables:
  - name: Cooperative scheduler (geos_kern.elf)
    description: 'Tiny M-mode supervisor that loads two ELF programs side by side,
      sets up per-program stacks, and time-slices between them via mtimecmp interrupts.
      Programs cooperate via geos_yield() in libgeos. No preemption beyond the timer
      tick. No memory protection (single VM, programs trust each other -- kernel only
      arbitrates pixel regions and input focus).

      '
    status: done
    tasks:
    - id: i.1.1
      title: Design supervisor memory layout
      status: done
      description: Decide stack/heap regions per program. Kernel reserves first 64KB,
        each program gets a 256KB slot. Document in docs/LAYER2_KERNEL.md.
      files:
      - docs/LAYER2_KERNEL.md
    - id: i.1.2
      title: Implement context-switch in M-mode trap handler
      status: done
      description: 'On mtimecmp interrupt, save callee-saved regs of running program,
        restore the other program''s regs, set new mtimecmp deadline, mret. Cooperative
        path: geos_yield() ecalls into kernel which does the same save/restore.

        Bootstrap done (2026-04-27): minimal geos_kern.elf links via crt0.S+libgeos,
        installs mtvec, programs mtimecmp, takes 5 timer interrupts using GCC interrupt("machine")
        attribute for save/restore, SBI-shutdowns cleanly. Verified end-to-end via
        examples/kern_run.rs (5,000,815 instructions, prints "[geos] kernel boot"
        + 5 ticks). Still pending: hand-written save/restore across two distinct program
        contexts, mscratch-based context pointer, and the geos_yield() ecall path.'
      files:
      - examples/riscv-hello/geos_kern.c
      - examples/kern_run.rs
    - id: i.1.3
      title: Two-program load + run smoke test
      status: done
      description: Build geos_kern.elf with two embedded ELF blobs (hello_a.elf, hello_b.elf).
        Boot via sh_run, observe interleaved UART output. Single-thread host VM is
        fine.
      files:
      - examples/riscv-hello/build.sh
      - tests/multi_program_smoke_test.sh
  - name: Pixel-region ownership
    description: 'Programs request a framebuffer region at startup via geos_request_region(x,
      y, w, h). The kernel tracks ownership and clips fb_present writes so program
      A cannot overwrite program B''s pixels. Out-of-region writes are silently masked
      (no fault -- programs trust the kernel, kernel does not trust the program).

      '
    status: done
    tasks:
    - id: i.2.1
      title: Add geos_request_region() to libgeos
      status: done
      description: SBI extension call that registers a rect with the kernel. Kernel
        stores per-program rect in a small table. Returns offset into framebuffer
        (program-local origin).
      files:
      - examples/riscv-hello/libgeos.c
      - examples/riscv-hello/libgeos.h
    - id: i.2.2
      title: Region clipping in fb_present path
      status: done
      description: 'When kernel handles fb_present (or the present interrupt), iterate
        only over the calling program''s rect. Pixels outside the rect are not touched
        in vm.screen.

        Implemented (2026-04-30): PresentCallback now passes the current clip rect
        alongside pixel data. Frame struct carries clip_rect: Option<(u32,u32,u32,u32)>.
        The GUI composite step in main.rs only blits pixels within the clip rect,
        leaving other programs'' regions untouched. Pixel-level write clipping was
        already implemented via inside_clip().

        Added 3 unit tests in framebuf.rs: test_present_callback_receives_clip_rect,
        test_two_programs_present_with_clip_rects, test_clip_rect_changes_between_presents.

        Also fixed 8-bit encoding overflow: w/h=256 now encodes as 0 (0-means-256
        convention), since 256 doesn''t fit in an 8-bit field. Updated libgeos.h geos_request_region()
        to use the same convention.'
      files:
      - src/riscv/framebuf.rs
      - src/riscv/live.rs
      - src/main.rs
      - examples/riscv-hello/libgeos.h
  - name: Capstone -- split-screen sh + life64
    description: 'The Layer 2 thesis demo. Left half (128x256) runs sh.c. Right half
      (128x256) runs a 32x32 life simulation (smaller variant of life64.c). Both visible
      simultaneously. Tab key cycles input focus between them; the focused program''s
      region gets a thin border. Proves: (1) two programs share a VM, (2) regions
      are enforced, (3) input is multiplexed by focus.

      '
    status: done
    acceptance_criteria:
    - description: Both sh prompt and life animation visible simultaneously on the
        Geometry OS display
      validation: Manual visual check + fb_dump showing both regions populated
      met: true
    - description: Keyboard typed in shell does not perturb life simulation
      validation: 'Test: type "echo hello" in shell, life32 cell count delta over
        same window matches unfocused-baseline'
      met: true
    tasks:
    - id: i.3.1
      title: life32.c -- smaller life variant for split-screen
      status: done
      description: 32x32 grid in 128x256 region, 4-pixel cell blocks, identical rules
        to life64. Built and running in geos_kern.elf split-screen.
      files:
      - examples/riscv-hello/life32.c
    - id: i.3.2
      title: Input focus routing in kernel
      status: done
      description: Tab key intercepted by kernel (does not pass to either program).
        Kernel maintains focused_id. geos_getchar() returns -1 for unfocused program.
        geos_sbi_get_focus() returns 1 if caller is focused.
      files:
      - examples/riscv-hello/geos_kern.c
    - id: i.3.3
      title: Border indicator for focused region
      status: done
      description: Kernel draws a 1-pixel white border around the focused region after
        each timer tick. kern_apply_clip() disables clipping temporarily to draw border
        lines on the region boundary.
      files:
      - examples/riscv-hello/geos_kern.c
    - id: i.3.4
      title: Split-screen smoke test
      status: done
      description: 'tests/split_screen_test.sh: boot kern.elf, inject "echo a\n",
        wait 2s, fb_dump, assert (a) shell region contains "a" pixels, (b) life region
        has nonzero cell count, (c) focused border visible.'
      files:
      - tests/split_screen_test.sh
  risks:
  - 'Cooperative scheduling is fragile: a program that never yields hangs the system.
    Mitigation: timer interrupt forces switch even if program does not call yield.'
  - 'Region clipping at fb_present granularity may flicker if programs present at
    different rates. Mitigation: kernel composites both regions into a single vm.screen
    update per host-render tick.'
  - 'Scope creep into "real OS" territory. Mitigation: every kernel feature must answer
    "could a libgeos helper do this?" -- if yes, it stays in libgeos.'
  technical_notes: 'The principle from SPEC.md governs every decision in this phase:
    only build what genuinely cannot live in a single program. Multi-tenancy on the
    framebuffer and input focus arbitration are the two things that qualify. Process
    isolation, memory protection, file descriptors, and signals do NOT qualify and
    must be rejected if they appear in scope discussions.

    '
