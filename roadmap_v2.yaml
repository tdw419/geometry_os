      - src/vm/disasm.rs
      scope_lines: 30
      status: done
    - id: p248.d1.t3
      title: Add comprehensive tests
      description: Test each opcode with known bit patterns. Test boundary (bit 0,
        bit 31). Test BNOT of 0 and 0xFFFFFFFF. Test BTST result in r0.
      scope_files:
      - src/vm/tests.rs
      scope_lines: 80
      status: done
    - id: p248.d1.t4
