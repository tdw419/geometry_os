- id: phase-248
  title: GeOS VM -- Bit Manipulation Opcodes (BNOT, BSET, BCLR, BTST)
  status: done
  goal: Add single-bit manipulation opcodes for embedded-style register bitfield control
  description: Many VM programs need to set, clear, test, and toggle individual bits
    in registers (flag registers, color masks, hardware port registers). Currently
    requires SHL + OR/AND + AND + CMP sequences (5-8 instructions). These opcodes
    reduce bit manipulation to 1 instruction each. BNOT inverts all bits (already
    available via XOR with 0xFFFFFFFF but a dedicated opcode is clearer).
  deliverables:
  - name: Bit manipulation opcodes
    status: done
    tasks:
    - id: p248.d1.t1
      title: Implement BNOT rd (0xCF), BSET rd, bit_reg (0xE1), BCLR rd, bit_reg (0xF0),
        BTST rd, bit_reg -> r0 (0xF1)
      description: BNOT = rd = !rd. BSET = rd |= (1 << bit_reg[4:0]). BCLR = rd &=
        !(1 << bit_reg[4:0]). BTST = r0 = (rd >> bit_reg[4:0]) & 1.
      scope_files:
      - src/vm/mod.rs
      - src/assembler/ops_extended.rs
      scope_lines: 80
      status: done
    - id: p248.d1.t2
      title: Add disassembler entries
