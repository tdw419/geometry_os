- id: phase-269
  title: GeOS VM -- Hash Table Opcodes (HASHINIT, HASHSET, HASHGET)
  status: complete
  goal: Add VM-level hash table for efficient key-value lookups from assembly
  description: Assembly programs currently implement hash tables manually (hash function
    + collision chains) which costs 50+ instructions per lookup. Native hash table
    opcodes enable O(1) average lookups, useful for symbol tables, entity lookup,
    and caching.
  deliverables:
  - name: Hash table opcodes
    status: done
    tasks:
    - id: p269.d1.t1
      title: Implement HASHINIT table_id, buckets_reg and HASHSET table_id, key_reg,
        val_reg (0xE2, 0xE3)
      description: HASHINIT allocates a hash table with N buckets (max 8 tables).
        HASHSET inserts or updates key->value pair using FNV-1a hashing. Store tables
        in Vm struct with HashMap<u32, u32> per bucket.
      scope_files:
      - src/vm/mod.rs
      - src/assembler/system_ops.rs
      scope_lines: 80
    - id: p269.d1.t2
      title: Implement HASHGET table_id, key_reg, dst_reg (0xE4) with not-found indicator
      description: HASHGET looks up key and stores value in dst. If not found, sets
        dst to 0xFFFFFFFF (sentinel). Tables persist across frames but reset on VM
        reset.
      scope_files:
      - src/vm/mod.rs
      - src/assembler/system_ops.rs
      scope_lines: 40
    - id: p269.d1.t3
      title: Add disassembler entries and comprehensive tests
      description: Test init with various bucket counts. Test set/get roundtrip. Test
        update existing key. Test get missing key returns sentinel. Test collision
