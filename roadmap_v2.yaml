- id: phase-311
  title: GeOS Program -- Raycaster (Wolfenstein-style)
  status: done
  goal: Implement a raycasting engine demonstrating trigonometry, fixed-point math,
    and per-column rendering.
  description: 'A raycaster renders a pseudo-3D view from a 2D map, the technique
    behind Wolfenstein 3D. This is an ideal showcase for the VM math capabilities:
    fixed-point trigonometry via lookup tables, per-column vertical line rendering
    via LINE or PSET, wall distance calculation with DIV, and sprite rendering for
    objects. The map is stored in RAM, player position/angle in registers. Arrow keys
    rotate and move, WASD strafe. Demonstrates: lookup tables, fixed-point arithmetic,
    per-pixel column rendering, and interactive game state.'
  deliverables:
  - name: Fixed-point trigonometry lookup table generation
    status: done
  - name: Ray casting and wall distance calculation
    status: done
  - name: Per-column wall rendering with height scaling
    status: done
